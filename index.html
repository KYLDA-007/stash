<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parts register</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        img {
            width: 150px;
            float: left;
            border: 3px solid black;
            border-radius: 10px;
        }
    </style>
    <script>
       
        let pocet = 3;

        function pridej() {
            let nazev = document.getElementById("novyNazev").value;
            let soubor = document.getElementById("novyObrazek").files[0];
            if (nazev == "" || !soubor) return;
            let n = ++pocet;
            let obr = URL.createObjectURL(soubor);

            document.getElementById("seznam").innerHTML +=
            `<li id="li${n}"><label for="cislo${n}">${nazev}</label></li>`;

            document.getElementById("polozky").innerHTML +=
            `<div class="line" id="radek${n}">
                <img src="${obr}" onclick="otevri(${n})" />
                <p>Value: <span id="vystup${n}">0</span></p>
                <button class="přepsat" onclick="smaz(${n})">delete</button>
             </div>`;

        }
        function smaz(n) {
            document.getElementById("li" + n).remove();
            document.getElementById("radek" + n).remove();
        }

    let typy = {};
    let aktualni = 0;

    function otevri(n) {
        aktualni = n;
        let nazev = document.querySelector('label[for="cislo' + n + '"]').textContent;
        document.getElementById("oknoNadpis").textContent = nazev;
        vykresliTypy();
        document.getElementById("okno").style.display = "block";
    }
    function zavri () {
        document.getElementById("okno").style.display = ("none");

    }
    function pridejTyp() {
        let t = document.getElementById("novyTyp").value;
        if (t === "") return;
        if (!typy[aktualni]) typy[aktualni] = [];
        typy[aktualni].push({ nazev: t, pocet: 0});
        document.getElementById("novyTyp").value = "";
        vykresliTypy();
    }
    function vykresliTypy() {
        let seznam = typy[aktualni] || [];
        let html = "";
        for (let i = 0; i < seznam.length; i++) {
            html += `<li>${seznam[i].nazev}
                <input type="number" value="${seznam[i].pocet}" onchange="zmenPocet(${i}, this.value)">
                <button class="přepsat" onclick="smazTyp(${i})">delete</button>
            </li>`;
        }
       document.getElementById("seznamTypu").innerHTML = html;
    }

    function zmenPocet(i, hodnota) {
        typy[aktualni][i].pocet = hodnota;
        spocitej();
    }

    function smazTyp(i) {
        typy[aktualni].splice(i, 1);
        vykresliTypy();
        spocitej();
    }
    function spocitej() {
        let soucet = 0;
        let seznam = typy[aktualni] || [];
        for (let i = 0; i < seznam.length; i++) {
            soucet += Number(seznam[i].pocet);
        }
        document.getElementById("vystup" + aktualni).textContent = soucet;
    }

    </script>
</head>
<body>
    <h1>List of parts</h1>
    <hr>
    <h3><ins>Add part</ins></h3>
<input type="text" id="novyNazev" placeholder="name of part">
<input type="file" id="novyObrazek" accept="image/*">
<button class="přepsat" onclick="pridej()">add</button>
    <h3><ins>Parts</ins></h3>
    <ol id="seznam"> 
        <li id="li1"><label for="cislo1">resistors</label></li>
        <li id="li2"><label for="cislo2">capacitors</label></li>
        <li id="li3"><label for="cislo3">transistors</label></li>
       
    </ol> 
    <div id="polozky">    
        <div class="line" id="radek1"> 
            <img src="IMAGES/reistor.jpg" onclick="otevri(1)"/>
            <p>Value: <span id=vystup1>0</span></p>
            <button class="přepsat" onclick="smaz(1)">delete</button>
        </div>

        <div class="line" id="radek2">
            <img src="IMAGES/kond.webp" onclick="otevri(2)" />
            <p>Value: <span id=vystup2>0</span></p>
            <button class="přepsat" onclick="smaz(2)">delete</button>

        </div>

        <div class="line" id="radek3">
            <img src="IMAGES/tran.jpg" onclick="otevri(3)" />
            <p>Value: <span id=vystup3>0</span></p>
            <button class="přepsat" onclick="smaz(3)">delete</button>

        </div>
    </div>

<div id="okno">
    <div id="oknoObsah">
        <h2 id="oknoNadpis"></h2>
        <input type="text" id="novyTyp" placeholder="add type">
        <button class="přepsat" onclick="pridejTyp()">add</button>
        <ul id="seznamTypu"></ul>
        <button class="přepsat" onclick="zavri()">close</button>
    </div>
</div>

</body>
</html>
