<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parts register</title>
    <link rel="stylesheet" href="styles.css">

    <script>
       
        let count = 3;

        function add() {
            let name = document.getElementById("newName").value;
            let file = document.getElementById("newPicture").files[0];
            if (name === "" || !file) return;
            let n = ++count;
            let img = URL.createObjectURL(file);

            document.getElementById("list").innerHTML +=
            `<li id="li${n}"><label for="number${n}">${name}</label></li>`;

            document.getElementById("items").innerHTML +=
            `<div class="line" id="line${n}">
                <img src="${img}" onclick="openWindow(${n})" />
                <p>count: <span id="output${n}">0</span></p>
                <button class="rename" onclick="removePart(${n})">delete</button>
             </div>`;

        }

    let types = JSON.parse(localStorage.getItem("types")) || {};
    let state = 0;

    function openWindow(n) {
        state = n;
        let name = document.querySelector('label[for="number' + n + '"]').textContent;
        document.getElementById("windowTitle").textContent = name;
        let sel = document.getElementById("newUnit");
        fill("newUnit", units[n] || []);
        fill("newVolt", volts[n] || []);
        fill("newPower", powers[n] || []);
        drawTypes();
        document.getElementById("window").style.display = "block";
    }
    function closeWindow () {
        document.getElementById("window").style.display = "none";

    }
    function addType() {
        let t = document.getElementById("newType").value;
        if (t === "") return;
        if (!types[state]) types[state] = [];
        let name = t;
        for (let id of ["newUnit", "newVolt", "newPower"]) {
            let sel = document.getElementById(id);
            if (sel.style.display !== "none") name += " " + sel.value;
        }
        types[state].push({ name: name, count: 0});
        document.getElementById("newType").value = "";
        drawTypes();
        save();
    }
    function drawTypes() {
        let list = types[state] || [];
        let html = "";
        for (let i = 0; i < list.length; i++) {
            html += `<li>${list[i].name}
                <input type="number" value="${list[i].count}" onchange="changeCount(${i}, this.value)">
                <button class="rename" onclick="removeTyp(${i})">delete</button>
            </li>`;
        }
       document.getElementById("typeList").innerHTML = html;
    }

    function changeCount(i, value) {
        types[state][i].count = value;
        updateSum(state);
        save();
    }

    function updateSum(k) {
        let sum = 0;
        for (let t of types[k] || []) sum += Number(t.count);
        let el = document.getElementById("output" + k);
        if (el) el.textContent = sum;
        }
    function removePart(n) {
        if (!confirm("reallyRemove??")) return;
        document.getElementById("li" + n).remove();
        document.getElementById("line" + n).remove();
    }
    function removeTyp(i) {
        if (!confirm("reallyRemove??")) return;
        types[state].splice(i, 1);
        drawTypes();
        updateSum(state);
        save();
        
    }
    function save() {
        localStorage.setItem("types", JSON.stringify(types));
    }
    window.onload = function () {
        for (let k in types) updateSum(k);
        if (localStorage.getItem("dark") === "true"){
            document.getElementById("darkToggle").checked = true;
            document.body.classList.add("dark");
        }
    };

    let units = {
        1:["\u03A9", "k\u03A9", "M\u03A9"],
        2:["pF","nF","\u00B5F", "mF"],
        3:["TO-92","TO-126","TO-220","TO-220F","TO-247","TO-3","TO-18","SOT-23","SOT-89","SOT-223","SOT-323"]

    };
    let volts = {
        2:["10V","16V","25V","35V","50V","63V","100V","160V"]
    };
    let powers = {
        1:["1/8W","0,25W","0,5W","1W","2W","3W","5W","10W"]
    }
    function fill(id, list) {
        let sel = document.getElementById(id);
        sel.innerHTML = "";
        for (let x of list) sel.innerHTML += `<option>${x}</option>`;
        sel.style.display = list.length ? "inline" : "none";


    }
    function toggleDark() {
        let on = document.getElementById("darkToggle").checked;
        document.body.classList.toggle("dark", on);
        localStorage.setItem("dark", on);
    }
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeWindow();
    });



    </script>
     
</head>
<body>
    <label class="switch">
        <input type="checkbox" id="darkToggle" onchange="toggleDark()">
        <span class="slider"></span>
    </label>
    <h1>List of parts</h1>
    <hr>
    <h3><ins>Add part</ins></h3>
<input type="text" id="newName" placeholder="name of part">
<input type="file" id="newPicture" accept="image/*">
<button class="rename" onclick="add()">add</button>
    <h3><ins>Parts</ins></h3>
    <ol id="list"> 
        <li id="li1"><label for="number1">resistors</label></li>
        <li id="li2"><label for="number2">capacitors</label></li>
        <li id="li3"><label for="number3">transistors</label></li>
       
    </ol> 
    <div id="items">    
        <div class="line" id="line1"> 
            <img src="IMAGES/reistor.jpg" onclick="openWindow(1)"/>
            <p>count: <span id="output1">0</span></p>
            <button class="rename" onclick="removePart(1)">delete</button>
        </div>

        <div class="line" id="line2">
            <img src="IMAGES/kond.webp" onclick="openWindow(2)" />
            <p>count: <span id="output2">0</span></p>
            <button class="rename" onclick="removePart(2)">delete</button>

        </div>

        <div class="line" id="line3">
            <img src="IMAGES/tran.jpg" onclick="openWindow(3)" />
            <p>count: <span id="output3">0</span></p>
            <button class="rename" onclick="removePart(3)">delete</button>

        </div>
    </div>

<div id="window" onclick="if (event.target === this) closeWindow()">
    <div id="windowObsah">
        <h2 id="windowTitle"></h2>
        <input type="text" id="newType" placeholder="add type">
        <select id="newUnit"></select>
        <select id="newVolt"></select>
        <select id="newPower"></select>
        <button class="rename" onclick="addType()">add</button>
        <ul id="typeList"></ul>
        <button class="rename" onclick="closeWindow()">close</button>
    </div>
</div>


</body>
</html>
